[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawleyes"
version = "0.1.0"
description = "CrawlEyes - Web Scraping & Search Toolkit for AI Agents. Full-text extraction + robust search + semantic reranking + MCP server. Zero API-key fallback, China-friendly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "waiky-github" }]
keywords = ["web-scraping", "search", "mcp-server", "ai-agent", "llm", "searxng", "crawl4ai", "rag", "semantic-search", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "crawl4ai>=0.9.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
rerank = ["fastembed>=0.3"]
dev = ["build", "twine"]

[project.scripts]
crawleyes-mcp = "crawleyes.mcp_crawl_server:main"

[tool.setuptools]
packages = ["crawleyes"]

[tool.setuptools.package-data]
crawleyes = ["py.typed"]

# ruff 显式规则配置：锁定 CI lint 行为，避免 noqa 注释被当作 unused(RUF100)
# select 与 CI 实际启用规则一致；ignore 声明项目有意使用的模式
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF", "UP", "SIM", "EXE"]
# BLE001: 宽异常捕获是项目的 fail-open 设计（限流/抓取/缓存容错），有意使用
# S110/S310: urllib 抓取与测试中触发的 bandit 规则，用途明确合理
ignore = ["BLE001", "S110", "S310", "A002", "N802"]
