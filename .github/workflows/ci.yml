name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install with --no-deps so CI doesn't pull heavy runtime deps
      # (crawl4ai/playwright are runtime deps, not needed for offline logic tests)
      - name: Install package (no-deps) + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install ruff build

      - name: Lint (ruff)
        run: ruff check crawleyes/ tests/ --output-format=github

      - name: Run offline logic tests
        run: python tests/test_core.py

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Optional: publish to PyPI on tags (commented out until credentials are set)
